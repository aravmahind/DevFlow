[project]
name = "devflow-ai-services"
version = "0.1.0"
description = "Devflow AI Services & Orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "pydantic>=2.5.0",
    "redis>=5.0.0",
    "openai>=1.30.0",
    "httpx>=0.26.0",
    "asyncpg>=0.29.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-groq>=0.2.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-postgres>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "llm", "memory", "prompts", "services", "tools", "utils", "workflows", "state", "graph"]
